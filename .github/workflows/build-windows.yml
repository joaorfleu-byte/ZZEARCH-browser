
name: Build ZZEARCH Browser for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build EXE
        run: npm run dist:win

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ZZEARCH-Browser-Windows
          path: dist/*.exe
